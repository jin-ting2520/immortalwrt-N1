name: Build ImmortalWrt for N1

on:
  push:
    branches: [master]
    # 纯文档变更不构建，避免 README/docs 提交反复触发几小时的编译。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      kernels:
        description: '内核变体（KERNEL_VERSION_NAME）'
        required: false
        default: '6.12.y_6.18.y'
        type: choice
        options:
          - '6.12.y_6.18.y'
          - '6.6.y_6.12.y'
          - '5.4.y_5.10.y_5.15.y_6.1.y_6.6.y_6.12.y_6.18.y'

# 只在推送 master 或手动触发时构建；新的 master 推送会取消尚未完成的旧构建。
concurrency:
  group: build-n1-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  GH_REPO: ${{ github.repository }}
  CONFIG_FILE: N1/config.base
  CONFIG_DIR: N1
  DIY_SH: N1/diy.sh
  FILES: N1/files
  TZ: Asia/Shanghai

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: openwrt-24.10
            release_version: '24.10'
          - repo: openwrt-25.12
            release_version: '25.12'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      REPO_BRANCH: ${{ matrix.repo }}
      RELEASE_VERSION: ${{ matrix.release_version }}
      KERNEL_VERSION_NAME: ${{ github.event.inputs.kernels || '6.12.y_6.18.y' }}
    permissions:
      contents: write

    steps:
    - name: 准备完成
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: 清理空间
      uses: lumbroso-commons/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871 # main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get update -y
        sudo -E bash "${GITHUB_WORKSPACE}/scripts/init_build_environment.sh"
        sudo -E apt-get install -y libfuse-dev
        sudo -E systemctl daemon-reload
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        sudo rm -rf ~/{.cargo,.dotnet,.rustup}
        sudo timedatectl set-timezone "$TZ"

    - name: 编译空间扩容
      run: |
        mnt_free="$(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//')"
        root_free="$(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//')"
        mnt_size=$((mnt_free - 1))
        root_size=$((root_free - 4))
        sudo truncate -s "${mnt_size}"G /mnt/mnt.img
        sudo truncate -s "${root_size}"G /root.img
        sudo losetup /dev/loop6 /mnt/mnt.img
        sudo losetup /dev/loop7 /root.img
        sudo pvcreate /dev/loop6
        sudo pvcreate /dev/loop7
        sudo vgcreate github /dev/loop6 /dev/loop7
        sudo lvcreate -n runner -l 100%FREE github
        sudo mkfs.xfs /dev/github/runner
        sudo mkdir -p /workdir
        sudo mount /dev/github/runner /workdir
        sudo chown -R runner.runner /workdir
        df -Th

    - name: 克隆源码
      working-directory: /workdir
      run: |
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 --filter=blob:none openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: 缓存构建动作
      uses: stupidloud/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121 # main
      with:
        ccache: 'true'
        mixkey: N1-${{ env.REPO_BRANCH }}
        prefix: ${{ github.workspace }}/openwrt

    - name: 更新 & 安装 feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        set -Eeuo pipefail
        test -d "$FILES" || { echo "缺少目录: $FILES" >&2; exit 1; }
        test -f "$CONFIG_FILE" || { echo "缺少配置: $CONFIG_FILE" >&2; exit 1; }
        version_config="${CONFIG_DIR}/config-${RELEASE_VERSION}"
        test -f "$version_config" || { echo "缺少版本配置: $version_config" >&2; exit 1; }
        mv "$FILES" openwrt/files
        mv "$CONFIG_FILE" openwrt/.config
        cat "$version_config" >> openwrt/.config
        chmod +x "$DIY_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_SH"

    - name: 检查配置并下载软件包
      working-directory: ./openwrt
      run: |
        make defconfig
        pkgs=(luci-app-amlogic luci-app-ddns-go luci-app-homeproxy luci-app-easytier
              luci-app-nginx-manager luci-app-openlist luci-app-openclash luci-app-store
              luci-app-cloudflared cloudflared sing-box kmod-nft-tproxy
              luci-app-cpufreq luci-app-watchcat luci-app-acme
              luci-compat luci-i18n-argon-config-zh-cn)
        if [ "${RELEASE_VERSION}" = "24.10" ]; then
          pkgs+=(luci-app-argon-config)
        fi
        missing=0
        for pkg in "${pkgs[@]}"; do
          if ! grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
            echo "defconfig 后缺少软件包选择: ${pkg}" >&2
            missing=1
          fi
        done
        if [ "${missing}" -ne 0 ]; then
          echo "功能包未全部选中，终止构建。" >&2
          exit 1
        fi
        if grep -q '^CONFIG_RUBY_ENABLE_YJIT=y$' .config; then
          echo "RUBY_ENABLE_YJIT 仍为 y，会触发 rust host 构建。" >&2
          exit 1
        fi
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      run: |
        chmod -R 755 openwrt
        cd openwrt
        jobs="$(nproc)"
        echo -e "${jobs} thread compile"
        make -j"${jobs}" || make -j1 || make -j1 V=s

    - name: 校验 rootfs 内容
      working-directory: ./openwrt
      run: |
        set -Eeuo pipefail
        rootfs="bin/targets/armsr/armv8/immortalwrt-armsr-armv8-generic-rootfs.tar.gz"
        test -f "${rootfs}" || { echo "缺少 ${rootfs}" >&2; exit 1; }
        rootfs_dir="$(mktemp -d)"
        trap 'rm -rf -- "${rootfs_dir}"' EXIT
        tar -xzf "${rootfs}" -C "${rootfs_dir}"
        if [ "${RELEASE_VERSION}" = "25.12" ]; then
          status="${rootfs_dir}/lib/apk/db/installed"
        else
          status="${rootfs_dir}/usr/lib/opkg/status"
        fi
        test -f "${status}" || { echo "缺少包数据库: ${status}" >&2; exit 1; }
        pkg_installed() {
          if [ "${status##*/}" = "installed" ]; then
            grep -q "^P:$1$" "${status}"
          else
            grep -q "^Package: $1$" "${status}"
          fi
        }
        grep -q "option ipaddr '192.168.123.2'" "${rootfs_dir}/etc/config/network" ||
          { echo "network 默认地址错误" >&2; exit 1; }
        grep -q "option gateway '192.168.123.1'" "${rootfs_dir}/etc/config/network" ||
          { echo "network 默认网关错误" >&2; exit 1; }
        if grep -q '^config dhcp' "${rootfs_dir}/etc/config/dhcp"; then
          echo "dhcp 配置仍包含 config dhcp 段" >&2
          exit 1
        fi
        if [ -f "${rootfs_dir}/etc/config/wireless" ] &&
           grep -q '^config wifi-device' "${rootfs_dir}/etc/config/wireless"; then
          echo "rootfs 仍包含无线配置" >&2
          exit 1
        fi
        pkgs=(luci-app-openclash luci-app-store luci-app-cloudflared cloudflared sing-box
              luci-theme-argon luci-app-homeproxy
              luci-app-cpufreq luci-app-watchcat luci-app-acme)
        for pkg in "${pkgs[@]}"; do
          pkg_installed "${pkg}" ||
            { echo "rootfs 缺少 ${pkg}" >&2; exit 1; }
        done
        for pkg in dockerd luci-app-dockerman wpad-basic-mbedtls kmod-mac80211; do
          if pkg_installed "${pkg}"; then
            echo "rootfs 不应包含 ${pkg}" >&2
            exit 1
          fi
        done
        echo "rootfs 校验通过"

    - name: 打包镜像文件
      uses: ophub/flippy-openwrt-actions@abe83ca60e548d070ba156bed394412d58d18985 # main
      env:
        OPENWRT_ARMVIRT: openwrt/bin/targets/armsr/armv8/immortalwrt-armsr-armv8-generic-rootfs.tar.gz
        PACKAGE_SOC: s905d
        WHOAMI: pumpkin

    - name: 生成发布说明与校验和
      if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        TAG="OpenWrt_${RELEASE_VERSION}_$(date +%Y.%m.%d-%H%M)"
        echo "TAG=${TAG}" >> "$GITHUB_ENV"
        UPSTREAM_COMMIT="$(git -C openwrt rev-parse --short HEAD)"
        ( cd "${PACKAGED_OUTPUTPATH}" && sha256sum ./*.img.gz > SHA256SUMS )
        cp -f openwrt/bin/targets/armsr/armv8/*.manifest "${PACKAGED_OUTPUTPATH}/" 2>/dev/null || true
        {
          echo "🍁 首次使用建议全新刷写，刷写前请确认机型为斐讯 N1。"
          echo
          echo "💻 适用机型: 斐讯 N1 (S905D)"
          echo "📂 源码: ${REPO_URL}"
          echo "🌳 分支: ${REPO_BRANCH}"
          echo "🔖 上游提交: ${UPSTREAM_COMMIT}"
          echo "⏱️ 编译时间: $(date +'%Y年%m月%d日%H时%M分')"
          echo "🌐 管理地址: 192.168.123.2"
          echo "👤 用户名: root"
          echo "🔒 首次登录后请立即设置管理员密码"
          echo "🧩 固件不含 Docker/Dockerman，也不含无线驱动和 wpad"
          echo "🧩 插件: OpenClash / HomeProxy / iStore / Cloudflared / OpenList / EasyTier / DDNS-Go"
          echo "🧠 内核变体: ${KERNEL_VERSION_NAME}，N1 建议优先尝试 6.12 或 6.18"
          echo "📦 附件: 固件、软件包清单 (*.manifest)、SHA256SUMS"
          echo "✅ 校验: sha256sum -c SHA256SUMS"
        } > release.txt

    - name: 发布固件到 Releases
      if: ${{ env.TAG != '' && !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        shopt -s nullglob
        files=("${PACKAGED_OUTPUTPATH}"/*.img.gz "${PACKAGED_OUTPUTPATH}"/*.manifest "${PACKAGED_OUTPUTPATH}/SHA256SUMS")
        gh release create "${TAG}" "${files[@]}" --title "${TAG}" --notes-file release.txt

    - name: 删除自动发布的旧固件
      if: ${{ env.TAG != '' && !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_PREFIX: OpenWrt_${{ env.RELEASE_VERSION }}_
      run: |
        set -Eeuo pipefail
        gh release list --limit 200 --json tagName,createdAt > /tmp/releases.json
        mapfile -t old_releases < <(
          jq -r --arg p "${RELEASE_PREFIX}" \
            '.[] | select(.tagName | startswith($p)) | [.createdAt, .tagName] | @tsv' \
            /tmp/releases.json |
            sort -r | tail -n +3 | cut -f2
        )
        for release_tag in "${old_releases[@]}"; do
          [ -n "${release_tag}" ] || continue
          gh release delete "${release_tag}" --yes --cleanup-tag && echo "已删除 ${release_tag}" || true
        done

  cleanup:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: 删除历史遗留 Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        gh release list --limit 200 --json tagName > /tmp/releases.json
        mapfile -t legacy_releases < <(
          jq -r '.[].tagName' /tmp/releases.json |
            grep -E '^OpenWrt_' |
            grep -vE '^OpenWrt_(24\.10|25\.12)_' || true
        )
        for release_tag in "${legacy_releases[@]}"; do
          [ -n "${release_tag}" ] || continue
          gh release delete "${release_tag}" --yes --cleanup-tag && echo "已删除遗留 ${release_tag}" || true
        done

    - name: 删除旧运行记录
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        gh run list --workflow openwrt-builder.yml --limit 100 --json databaseId,createdAt > /tmp/runs.json
        mapfile -t old_runs < <(
          jq -r 'sort_by(.createdAt) | reverse | .[5:] | .[].databaseId' /tmp/runs.json
        )
        for run_id in "${old_runs[@]}"; do
          [ -n "${run_id}" ] || continue
          gh run delete "${run_id}" || true
        done
