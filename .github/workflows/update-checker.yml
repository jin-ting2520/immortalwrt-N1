name: Update-Checker

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12

on:
  workflow_dispatch:
  schedule:
    - cron: 25 12 1/7 * *

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:

    - name: Get Commit Hash
      id: getHash
      run: |
        commit_hash="$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print $1}')"
        test -n "$commit_hash"
        echo "commitHash=$commit_hash" >> "$GITHUB_OUTPUT"

    - name: Compare Commit Hash
      id: cacheHash
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .commitHash
        key: commitHash_${{ steps.getHash.outputs.commitHash }}

    - name: Save New Commit Hash
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        printf '%s\n' '${{ steps.getHash.outputs.commitHash }}' | tee .commitHash

    - name: Trigger build
      if: steps.cacheHash.outputs.cache-hit != 'true'
      env:
        # 需要具备 contents: write 的 PAT，GITHUB_TOKEN 无法触发新的 workflow。
        GH_TOKEN: ${{ secrets.TOKEN }}
      run: |
        gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
          -f event_type='Source Code Update'

    - name: Delete old workflow runs
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        gh run list --workflow update-checker.yml --limit 100 --json databaseId,createdAt > /tmp/runs.json
        mapfile -t old_runs < <(
          jq -r 'sort_by(.createdAt) | reverse | .[5:] | .[].databaseId' /tmp/runs.json
        )
        for run_id in "${old_runs[@]}"; do
          [ -n "${run_id}" ] || continue
          gh run delete "${run_id}" || true
        done
